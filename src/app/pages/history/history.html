<section class="history-page">
  <header class="page-head">
    <h1>History</h1>
    <p class="subtitle">Finished Soul Link runs, with every death on a timeline.</p>
  </header>

  @for (run of runs(); track run.id) {
    <app-run-timeline [run]="run" />
  } @empty {
    <p class="empty">
      No finished run yet. When a Soul Link run is over, click “End run” to keep it here.
    </p>
  }
</section>
