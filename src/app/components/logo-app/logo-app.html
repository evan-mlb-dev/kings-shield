<a routerLink="/" class="logo-link" aria-label="King's Shield home">
  <span class="shield">
    <img class="logo-app" src="images/logo-kings-shield.png" alt="" />
    <span class="gem gem-top" aria-hidden="true"></span>
    <span class="gem gem-left" aria-hidden="true"></span>
    <span class="gem gem-right" aria-hidden="true"></span>
  </span>
  <span class="title-app">
    <span>King's</span>
    <span>Shield</span>
  </span>
</a>
<a
  class="version-badge"
  [href]="changelog"
  target="_blank"
  rel="noopener"
  [title]="'King\'s Shield ' + version + ': what\'s new'"
  >v{{ version }}</a
>
